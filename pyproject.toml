[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "albanna-ai-chat"
version = "0.3.0"
description = "Albanna AI Chat — the frappe-mcp core: chat runtime, file tools, and the extension seam."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albanna Software Solutions", email = "ahmedalbanna966@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["albanna_ai_chat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
